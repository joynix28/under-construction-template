<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Chell">
  <defs>
    <radialGradient id="disc" cx="50%" cy="40%" r="64%">
      <stop offset="0" stop-color="#1b1a23"/>
      <stop offset="0.7" stop-color="#100f15"/>
      <stop offset="1" stop-color="#08070b"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a55"/>
      <stop offset="0.5" stop-color="#ff3d21"/>
      <stop offset="1" stop-color="#c81405"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="250" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#2a1216" stroke-width="4" opacity="0.9"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#ff3d21" stroke-width="2" opacity="0.18"/>

  <!-- Repères latéraux (rappel du logo, effacés aux petites tailles) -->
  <g stroke="#8fe0ff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92 300 v-52 h22"/>
    <path d="M66 300 h26"/>
    <path d="M420 300 v-52 h-22"/>
    <path d="M446 300 h-26"/>
  </g>

  <!-- Triangle néon (pointe vers le bas) -->
  <path d="M118 150 H394 L256 372 Z" fill="none" stroke="url(#neon)" stroke-width="18"
        stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M150 166 H362 L256 340 Z" fill="none" stroke="#5a0f07" stroke-width="6" opacity="0.75"/>

  <!-- Point central -->
  <circle cx="256" cy="248" r="15" fill="none" stroke="#ff4a2a" stroke-width="10" filter="url(#glow)"/>
</svg>
